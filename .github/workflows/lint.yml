name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx oxlint src
        working-directory: app
      - run: npm run check:browser-compat
        working-directory: app

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: app

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init git submodules
        run: bash scripts/ci-submodules.sh
      - uses: ./.github/actions/setup
        with:
          rust: true
      # tauri.conf.json bundles procedures/*.js as resources; the build script fails when none exist.
      - run: npm run build:procedures
        working-directory: app
      - run: cargo clippy -- -D clippy::correctness
        working-directory: app/src-tauri

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init git submodules
        run: bash scripts/ci-submodules.sh
      - uses: ./.github/actions/setup
        with:
          rust: true
      # tauri.conf.json bundles procedures/*.js as resources; the build script fails when none exist.
      - run: npm run build:procedures
        working-directory: app
      - name: Run cargo test
        working-directory: app/src-tauri
        env:
          # Cap parallel link/compile pressure on 7GB runners (OOM kills look like cc exit 1).
          CARGO_BUILD_JOBS: "2"
        run: cargo test

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx vitest run
        working-directory: app
      - run: npm run test:procedures
        working-directory: app

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run gen:image-dims
        working-directory: app
      - name: Fail if image dimensions are stale (run npm run gen:image-dims)
        run: git diff --exit-code -- app/src/components/manual/manual-img-dims.gen.ts
