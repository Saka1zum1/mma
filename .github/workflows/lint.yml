name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx eslint src/
        working-directory: app

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: app

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init git submodules
        run: bash scripts/ci-submodules.sh
      # apt-get (not cache-apt-pkgs-action): the cache action can restore .so files
      # without pkg-config .pc metadata, so glib-sys fails with "glib-2.0 not found".
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libglib2.0-dev
          pkg-config --exists 'glib-2.0 >= 2.70'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo clippy -- -D clippy::correctness
        working-directory: app/src-tauri

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init git submodules
        run: bash scripts/ci-submodules.sh
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libglib2.0-dev
          pkg-config --exists 'glib-2.0 >= 2.70'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          prefix-key: rust-tests-v4
      - name: Run cargo test
        working-directory: app/src-tauri
        env:
          # Cap parallel link/compile pressure on 7GB runners (OOM kills look like cc exit 1).
          CARGO_BUILD_JOBS: "2"
        run: cargo test

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx vitest run
        working-directory: app

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run gen:image-dims
        working-directory: app
      - name: Fail if image dimensions are stale (run npm run gen:image-dims)
        run: git diff --exit-code -- app/src/components/manual/manual-img-dims.gen.ts
